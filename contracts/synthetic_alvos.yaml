table: silver.synthetic_alvos
layer: silver
version: 1
description: >
  ALVOS do modelo, medidos no período de rótulo (voos de 2026-03-01 a 2026-08-31), com corte em 2026-02-28. Só para
  treino e avaliação: NUNCA usar como entrada nem para construir feature. Evasão é PARCIAL: voar <= 30% do esperado.
  Evasão e CLV vêm das viagens futuras, que já incorporam o evento oculto de parada e o acaso de Poisson (premissa P-13).
  Elegibilidade (só histórico) fica em synthetic_elegibilidade.
produced_by: pipelines/synthetic/generate.py
sources: [silver.synthetic_viagens_futuro, silver.synthetic_elegibilidade]
storage:
  format: parquet (zstd)
  path: data/silver/synthetic_alvos/data.parquet
grain: [cliente_id]
columns:
  - {name: cliente_id, type: VARCHAR(36), nullable: false, description: "FK synthetic_clientes.cliente_id"}
  - {name: data_corte, type: DATE, nullable: false, description: "Fim do histórico (2026-02-28 na janela padrão); os alvos olham os 6 meses seguintes"}
  - {name: evasao, type: TINYINT, nullable: true, description: "1 = trechos voados de 2026-03 a 2026-08 <= 30% de synthetic_elegibilidade.trechos_esperados_6m; 0 = acima. Nulo se elegivel_evasao = false (inclui quem nunca voou no histórico)"}
  - {name: trechos_futuros_6m, type: BIGINT, nullable: false, description: Trechos voados (não cancelados) no período de rótulo}
  - {name: clv_futuro_6m_brl, type: DOUBLE, nullable: false, unit: BRL, description: "Soma das tarifas dos trechos voados no período de rótulo (receita aérea bruta de 6 meses; não é margem); 0 se não voou"}
quality:
  - grão único
  - evasao nulo se e somente se synthetic_elegibilidade.elegivel_evasao = false
