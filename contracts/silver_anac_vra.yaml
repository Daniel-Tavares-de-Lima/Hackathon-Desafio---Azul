table: silver.anac_vra
layer: silver
version: 1
description: >
  VRA - Voo Regular Ativo da ANAC: cada etapa de voo regular prevista, com horarios previstos e
  realizados, situacao (realizado/cancelado) e justificativa. Somente etapas domesticas.
  Insumo da ameaca A (atraso/cancelamento) e da ameaca B (frequencia da Azul por rota).
source:
  publisher: ANAC
  url: https://siros.anac.gov.br/siros/registros/diversos/vra/{ano}/VRA_{ano}_{MM}.csv
  produced_by: pipelines/ingest_anac.py vra
storage:
  format: parquet (zstd)
  path: data/silver/anac_vra/ano_mes=AAAA-MM/data.parquet
  partition_by: [ano_mes]   # mes do ARQUIVO ANAC (referencia), nao necessariamente da partida
grain: [empresa_icao, numero_voo, origem_icao, data_referencia, partida_prevista]
filters:
  - origem_icao e destino_icao com prefixo ICAO brasileiro (SB, SD, SI, SJ, SN, SS, SW)
columns:
  - {name: empresa_icao, type: VARCHAR(3), nullable: false, description: Sigla ICAO da empresa}
  - {name: empresa_nome, type: VARCHAR, nullable: true, description: Razao social da empresa}
  - {name: numero_voo, type: VARCHAR, nullable: false, description: Numero do voo (texto, preserva zeros a esquerda)}
  - {name: codigo_di, type: VARCHAR(1), nullable: true, description: "Codigo DI da ANAC (tipo de autorizacao/etapa; 0 = regular)"}
  - {name: tipo_linha, type: VARCHAR(1), nullable: true, description: "Codigo tipo de linha ANAC (na janela: N passageiro nacional, C cargueiro, G, I internacional; ver PREMISSAS P-02)"}
  - {name: modelo_equipamento, type: VARCHAR, nullable: true, description: Codigo ICAO do modelo da aeronave}
  - {name: assentos, type: INTEGER, nullable: true, description: Numero de assentos da aeronave}
  - {name: origem_icao, type: VARCHAR(4), nullable: false, description: ICAO do aeroporto de origem}
  - {name: origem_descricao, type: VARCHAR, nullable: true, description: Nome/cidade/UF do aeroporto de origem}
  - {name: destino_icao, type: VARCHAR(4), nullable: false, description: ICAO do aeroporto de destino}
  - {name: destino_descricao, type: VARCHAR, nullable: true, description: Nome/cidade/UF do aeroporto de destino}
  - {name: partida_prevista, type: TIMESTAMP, nullable: true, description: Data/hora de partida prevista (como publicado pela ANAC; fuso nao informado no arquivo)}
  - {name: partida_real, type: TIMESTAMP, nullable: true, description: Data/hora de partida realizada (nulo se cancelado)}
  - {name: chegada_prevista, type: TIMESTAMP, nullable: true, description: Data/hora de chegada prevista}
  - {name: chegada_real, type: TIMESTAMP, nullable: true, description: Data/hora de chegada realizada (nulo se cancelado)}
  - {name: situacao_voo, type: VARCHAR, nullable: true, description: "Situacao do voo em maiusculas (REALIZADO, CANCELADO, ...)"}
  - {name: justificativa, type: VARCHAR, nullable: true, description: Justificativa ANAC para atraso/cancelamento}
  - {name: data_referencia, type: DATE, nullable: true, description: Data de referencia da etapa no VRA}
  - {name: situacao_partida, type: VARCHAR, nullable: true, description: "Faixa de pontualidade da partida (Pontual, Antecipado, Atraso 30-60, ...)"}
  - {name: situacao_chegada, type: VARCHAR, nullable: true, description: Faixa de pontualidade da chegada}
  - {name: codeshare, type: VARCHAR, nullable: true, description: Indicacao de codeshare publicada pela ANAC}
  - {name: atraso_partida_min, type: BIGINT, nullable: true, description: "partida_real - partida_prevista em minutos (negativo = antecipado)"}
  - {name: atraso_chegada_min, type: BIGINT, nullable: true, description: "chegada_real - chegada_prevista em minutos (negativo = antecipado)"}
  - {name: ano_mes, type: VARCHAR(7), nullable: false, description: "Particao 'AAAA-MM' (hive) = mes do arquivo VRA"}
