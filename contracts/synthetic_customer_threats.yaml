table: silver.synthetic_customer_threats
layer: silver
version: 1
description: >
  Ameaças que atingem clientes, consumida pelo Radar. Uma linha = cliente x tipo x mês x par. A = ameaça A GRAVE: 2 ou
  mais trechos com atraso de partida > 60 min ou cancelados em até 90 dias (linha no 2º evento; premissa P-12); B = par com saída total ou redução da Azul em gold.route_exits; C = queda
  de tarifa de concorrente em gold.route_competition. B e C ligam o cliente que voou o par nos 12 meses até o mês da
  ameaça (premissa P-12). B e C são raros nas gold aprovadas e não foram inflados.
produced_by: pipelines/synthetic/generate.py
sources: [silver.synthetic_viagens, silver.synthetic_viagens_futuro, gold.route_disruptions, gold.route_exits, gold.route_competition]
storage:
  format: parquet (zstd)
  path: data/silver/synthetic_customer_threats/data.parquet
grain: [cliente_id, tipo_ameaca, ano_mes, par_rota, detalhe, data_ameaca]   # A: um por gatilho (viagem_id do 2º evento)
columns:
  - {name: cliente_id, type: VARCHAR(36), nullable: false, description: "FK synthetic_clientes.cliente_id"}
  - {name: tipo_ameaca, type: VARCHAR(1), nullable: false, description: "'A' atraso/cancelamento grave (2 eventos em 90 dias), 'B' rota órfã, 'C' escudo de rota"}
  - {name: ano_mes, type: VARCHAR(7), nullable: false, description: "Mês da ameaça 'AAAA-MM' (A: mês do voo do 2º evento; B: mes_saida ou mês marcado; C: mês marcado)"}
  - {name: data_ameaca, type: DATE, nullable: false, description: "A: data do voo do 2º evento; B e C: primeiro dia do mês da ameaça"}
  - {name: par_rota, type: VARCHAR(9), nullable: false, description: "Par em ordem alfabética (join com as gold)"}
  - {name: origem_icao, type: VARCHAR(4), nullable: true, description: "Só em A: origem do trecho do 2º evento; nulo em B e C"}
  - {name: destino_icao, type: VARCHAR(4), nullable: true, description: "Só em A: destino do trecho; nulo em B e C"}
  - {name: detalhe, type: VARCHAR, nullable: false, description: "grave_2_eventos_90d (A); saida_total, reducao (B); queda_tarifa (C)"}
  - {name: viagem_id, type: VARCHAR(36), nullable: true, description: "Só em A: FK do trecho do 2º evento (synthetic_viagens ou synthetic_viagens_futuro)"}
  - {name: periodo, type: VARCHAR, nullable: false, description: "'historico' (mês <= 2026-02) ou 'rotulo' (mar a ago/2026); o modelo só pode usar 'historico'"}
quality:
  - tipo_ameaca em (A, B, C)
  - A tem viagem_id; B e C não
  - sem redução antes de 2025-11 nem queda de tarifa antes de 2025-10; saída total desde mes_saida 2024-11 (limitação das gold, premissa P-12)
